<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="fav-leaf" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="60%" stop-color="#00D287" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="fav-cyan" x1="24" y1="6" x2="42" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00F5A0" flood-opacity="0.8" />
    </filter>
    <filter id="fav-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#06B6D4" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Agricultural field furrow contours at base -->
  <path d="M14 41 C 18 39, 30 39, 34 41" stroke="#06B6D4" stroke-width="1.6" stroke-linecap="round" opacity="0.6" />
  <path d="M10 44 C 16 41.5, 32 41.5, 38 44" stroke="#00F5A0" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

  <!-- Left Half: Organic Leaf Blade -->
  <path d="M24 5 C 15 11, 8 20, 8 28.5 C 8 35.5, 14 40, 24 41 C 24 33, 24 18, 24 5 Z" fill="url(#fav-leaf)" fill-opacity="0.95" />
  <path d="M24 15 C 18 20, 14 26, 13 32" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.4" />

  <!-- Right Half: AI Neural Circuit Polygon -->
  <path d="M24 5 L 33 13 L 38 21 L 37 32 L 31 38 L 24 41" stroke="url(#fav-cyan)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#06B6D4" fill-opacity="0.1" />

  <!-- Central Stem Spine -->
  <path d="M24 41 L 24 5" stroke="#00F5A0" stroke-width="2.2" stroke-linecap="round" filter="url(#fav-glow)" />

  <!-- Circuit Branch 1 -->
  <path d="M24 13 L 30 17 L 35 17" stroke="#06B6D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="35" cy="17" r="2.2" fill="#00F5A0" filter="url(#fav-glow)" />
  <circle cx="30" cy="17" r="1" fill="#06B6D4" />

  <!-- Circuit Branch 2 -->
  <path d="M24 22 L 31 25 L 37 30" stroke="#00F5A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="37" cy="30" r="2.6" fill="#06B6D4" filter="url(#fav-glow-cyan)" />
  <circle cx="31" cy="25" r="1.2" fill="#00F5A0" />

  <!-- Circuit Branch 3 -->
  <path d="M24 31 L 28 34 L 32 37" stroke="#06B6D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="32" cy="37" r="2" fill="#00F5A0" filter="url(#fav-glow)" />

  <!-- Central Neural Core Node -->
  <circle cx="24" cy="22" r="3.4" fill="#0B0F14" stroke="#00F5A0" stroke-width="1.8" />
  <circle cx="24" cy="22" r="1.8" fill="#00F5A0" filter="url(#fav-glow)" />

  <!-- Top Apex Sprout Beacon -->
  <circle cx="24" cy="5" r="1.6" fill="#00F5A0" filter="url(#fav-glow)" />
</svg>
